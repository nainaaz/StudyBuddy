<div id="courses-list">
    {% if user.courses %}
    <ul>
        {% for c in user.courses %}
        <li>
            {{ c.code }}
            <button 
                hx-post="/delete_course/{{ c.code }}"
                hx-target="#courses-list"
                hx-swap="outerHTML"
                style="background:red; color:white; padding:2px 6px; border:none; margin-left:6px; cursor:pointer;">
                X
            </button>
        </li>
        {% endfor %}
    </ul>
    {% else %}
    <p>No courses yet</p>
    {% endif %}
</div>
